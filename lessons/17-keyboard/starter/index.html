<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Клавиатура — стартер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Семь клавиш</h1>
    <p class="now">Сейчас: <strong id="note-name">—</strong></p>
    <div class="keys" id="keys">
      <button type="button" class="key" data-index="0">C</button>
      <button type="button" class="key" data-index="1">D</button>
      <button type="button" class="key" data-index="2">E</button>
      <button type="button" class="key" data-index="3">F</button>
      <button type="button" class="key" data-index="4">G</button>
      <button type="button" class="key" data-index="5">A</button>
      <button type="button" class="key" data-index="6">B</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
