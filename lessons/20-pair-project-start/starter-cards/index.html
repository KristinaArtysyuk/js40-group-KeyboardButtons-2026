<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточки терминов — парный проект</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Карточки терминов</h1>
    <p class="roles">Один — вид карточки, второй — массив терминов в <code>script.js</code> (нужно 8+).</p>
    <p id="progress" class="muted">1 / 3</p>

    <button type="button" id="card" class="flashcard">
      <span id="card-text">термин</span>
      <span class="hint">Нажми, чтобы перевернуть</span>
    </button>

    <button type="button" id="next-btn">Следующая</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
