<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Клавиатура+ — парный проект</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Клавиатура+</h1>
    <p class="roles">Один — вид клавиш, второй может добавить чёрные клавиши. Игра с A S D F G H J уже есть.</p>
    <p class="now">Сейчас: <strong id="note-name">—</strong></p>
    <div class="keys" id="keys">
      <button type="button" class="key" data-index="0">C<br><small>A</small></button>
      <button type="button" class="key" data-index="1">D<br><small>S</small></button>
      <button type="button" class="key" data-index="2">E<br><small>D</small></button>
      <button type="button" class="key" data-index="3">F<br><small>F</small></button>
      <button type="button" class="key" data-index="4">G<br><small>G</small></button>
      <button type="button" class="key" data-index="5">A<br><small>H</small></button>
      <button type="button" class="key" data-index="6">B<br><small>J</small></button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
