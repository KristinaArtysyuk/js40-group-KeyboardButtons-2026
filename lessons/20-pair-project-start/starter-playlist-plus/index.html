<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Плейлист+ — парный проект</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Плейлист+</h1>
    <p class="roles">Один — вид списка, второй — свои треки в массиве. Добавить / удалить / «сейчас играет» уже есть.</p>
    <p class="now">Сейчас играет: <strong id="now-playing">ничего не выбрано</strong></p>

    <div class="row">
      <input id="song-input" type="text" placeholder="Название трека">
      <button type="button" id="add-btn">Добавить</button>
      <button type="button" id="remove-btn" class="danger">Удалить выбранный</button>
    </div>

    <ul id="track-list"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
