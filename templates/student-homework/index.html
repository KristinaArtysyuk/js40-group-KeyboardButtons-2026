<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Домашнее задание — JavaScript для музыкантов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sheet">
    <h1 id="title">Моя музыкальная страница</h1>
    <p id="subtitle">Шаблон ДЗ. Замени текст на своё задание.</p>
    <p>Темп: <strong id="tempo-display">100</strong> BPM</p>
    <div class="controls">
      <button type="button" id="btn-down">−10 BPM</button>
      <button type="button" id="btn-up">+10 BPM</button>
      <button type="button" id="btn-hello">Привет, консоль!</button>
    </div>
    <ul id="playlist">
      <li>Прелюдия</li>
      <li>Этюд</li>
      <li>Соната</li>
    </ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
